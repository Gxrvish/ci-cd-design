# The dashboard origin (ADR-0015). App routes arrive with the agent (M1 slice 4).
resolver 127.0.0.11 valid=10s;  # Docker's DNS: find api again after it is recreated

server {
    listen 80 default_server;
    return 404;  # unknown host names get nothing
}

server {
    listen 80;
    server_name cloudforge-console.localhost;

    location / {
        # A variable in proxy_pass makes Nginx look the name up per request, through `resolver`, instead of once
        # at startup. So a recreated api container, with a new IP address, is found again.
        set $api http://api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
