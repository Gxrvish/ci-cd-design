# Local CloudForge (docs/operations/local-setup.md). Start with `make up`.
name: cloudforge

x-env: &env
  PGHOST: postgres
  PGDATABASE: cloudforge
  CF_GITEA_URL: http://gitea:3000  # as runners reach Gitea
  CF_REGISTRY: registry:5000  # as buildkitd pushes

# migrate, api and (from M2) worker share one image, built from its runtime stage.
x-control-plane: &control-plane
  image: cloudforge-control-plane
  build: {context: control-plane, target: runtime}
  environment: *env
  networks: [cf-control]

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets: [pg_superuser_password, pg_owner_password, pg_app_password]
    volumes:
      - postgres:/var/lib/postgresql
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [cf-control]
    healthcheck:  # over TCP: the temporary server that runs init.sql listens on the socket only
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres"]
      interval: 2s
      retries: 30

  migrate:
    <<: *control-plane
    command: ["python", "-m", "cloudforge.migrate"]
    secrets: [pg_owner_password]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *control-plane
    secrets: [pg_app_password]
    networks: [cf-control, cf-edge]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 2s
      retries: 30

  nginx:
    image: nginx:1.31.8-alpine
    ports:  # 8080 by default: port 80 is often taken (on this host by Apache)
      - "127.0.0.1:${CF_HTTP_PORT:-8080}:80"
      - "[::1]:${CF_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/console.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [cf-edge]
    depends_on:
      api: {condition: service_healthy}

  test:
    build: {context: control-plane, target: test}
    profiles: [test]
    environment:
      <<: *env
      PGDATABASE: cloudforge_test
    secrets: [pg_owner_password, pg_app_password]
    networks: [cf-control]
    depends_on:
      postgres: {condition: service_healthy}

networks:
  cf-control: {name: cf-control, internal: true}  # the database never reaches the internet
  cf-edge: {name: cf-edge}

volumes:
  postgres: {}

secrets:
  pg_superuser_password: {file: secrets/pg_superuser_password}
  pg_owner_password: {file: secrets/pg_owner_password}
  pg_app_password: {file: secrets/pg_app_password}
