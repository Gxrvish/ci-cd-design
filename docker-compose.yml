# Local CloudForge (docs/operations/local-setup.md). Start with `make up`.
name: cloudforge

# x-* blocks are ignored by Compose: they hold settings to reuse. `&env` names a block, `*env` inserts it,
# and `<<: *control-plane` merges one into a service (YAML anchors).
x-env: &env
  PGHOST: postgres
  PGDATABASE: cloudforge
  CF_GITEA_URL: http://gitea:3000  # as runners reach Gitea
  CF_REGISTRY: registry:5000  # as buildkitd pushes

# migrate, api and (from M2) worker share one image, built from its runtime stage.
x-control-plane: &control-plane
  image: cloudforge-control-plane
  build: {context: control-plane, target: runtime}
  environment: *env
  networks: [cf-control]

# Start order, through depends_on: postgres healthy, then migrate exits 0, then api healthy, then nginx.
# Services with `profiles: [test]` start only through `make test`.
services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    secrets: [pg_superuser_password, pg_owner_password, pg_app_password]
    volumes:
      - postgres:/var/lib/postgresql
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [cf-control]
    healthcheck:  # over TCP: the temporary server that runs init.sql listens on the socket only
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=postgres"]
      interval: 2s
      retries: 30

  migrate:
    <<: *control-plane
    command: ["sh", "-c", "python -m cloudforge.migrate && python -m cloudforge.seed"]  # migrations, then seeds (ADR-0014)
    secrets: [pg_owner_password]
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *control-plane
    secrets: [pg_app_password]
    networks: [cf-control, cf-edge]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 2s
      retries: 30

  nginx:
    image: nginx:1.31.8-alpine
    ports:  # 8080 by default: port 80 is often taken (on this host by Apache)
      - "127.0.0.1:${CF_HTTP_PORT:-8080}:80"
      - "[::1]:${CF_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/console.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [cf-edge]
    depends_on:
      api: {condition: service_healthy}

  buildkitd:  # rootless, one per runner, reached only through its socket (ADR-0009)
    image: cloudforge-buildkitd
    build: infrastructure/buildkit
    security_opt: [seccomp=unconfined, apparmor=unconfined, systempaths=unconfined]
    cpus: 4  # these limits cover all of this runner's builds together
    mem_limit: 4g
    pids_limit: 2048
    volumes:
      - buildkit-state:/home/user/.local/share/buildkit
      - buildkit-socket:/run/user/61000
    networks: [cf-build]
    healthcheck:
      test: ["CMD", "buildctl", "debug", "workers"]
      interval: 2s
      retries: 30

  registry:  # buildkitd pushes to registry:5000; the host's Docker daemon pulls from 127.0.0.1:5000
    image: registry:2.8.3
    environment:
      REGISTRY_AUTH: htpasswd  # shared accounts until M8's job-scoped tokens (ADR-0009)
      REGISTRY_AUTH_HTPASSWD_REALM: cloudforge
      REGISTRY_AUTH_HTPASSWD_PATH: /run/secrets/registry_htpasswd
    secrets: [registry_htpasswd]
    ports: ["127.0.0.1:5000:5000"]
    volumes: [registry:/var/lib/registry]
    networks: [cf-build]

  test:
    build: {context: control-plane, target: test}
    profiles: [test]
    environment:
      <<: *env
      PGDATABASE: cloudforge_test
    secrets: [pg_owner_password, pg_app_password]
    networks: [cf-control]
    depends_on:
      postgres: {condition: service_healthy}

  test-build:  # cfnode's BuildKit test, beside buildkitd. No network: buildkitd fetches registry tokens itself (threat 32)
    image: cloudforge-buildkitd
    profiles: [test]
    entrypoint: ["/build.test", "-test.v", "-test.run", "TestImage"]
    network_mode: none
    environment: *env
    secrets: [registry_runner]
    volumes:
      - buildkit-socket:/run/user/61000
      - ./cfnode/bin/build.test:/build.test:ro  # built on the host by `make test-go`
    depends_on:
      buildkitd: {condition: service_healthy}
      registry: {condition: service_started}

networks:
  cf-control: {name: cf-control, internal: true}  # the database never reaches the internet
  cf-edge: {name: cf-edge}
  cf-build: {name: cf-build}  # buildkitd and its RUN steps: the internet and the registry, nothing else (ADR-0012)

volumes:
  postgres: {}
  buildkit-state: {}  # stub: a fixed-size filesystem from M5 (docs/stubs.md)
  buildkit-socket: {}
  registry: {}

secrets:
  pg_superuser_password: {file: secrets/pg_superuser_password}
  pg_owner_password: {file: secrets/pg_owner_password}
  pg_app_password: {file: secrets/pg_app_password}
  registry_htpasswd: {file: secrets/registry_htpasswd}
  registry_runner: {file: secrets/registry_runner}
